<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Diwali, Shravika ❤️</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Sacramento&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Montserrat', sans-serif; background: linear-gradient(135deg, #FAF5FF 0%, #FEF9C3 50%, #E0F2FE 100%); color: #4A3B5C; margin: 0; min-height: 100vh; }
    .font-serif { font-family: 'Playfair Display', serif; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function App() {
      const [welcomeOpen, setWelcomeOpen] = useState(true);
      const [potRevealed, setPotRevealed] = useState(false);
      const [currentCard, setCurrentCard] = useState(0);
      const [activeModal, setActiveModal] = useState(null);
      const [isPlaying, setIsPlaying] = useState(false);
      const [lastThing, setLastThing] = useState(false);
      const canvasRef = useRef(null);
      const audioCtxRef = useRef(null);
      const melodyIntervalRef = useRef(null);

      const toggleAudio = (e) => {
        if (e) e.stopPropagation();
        if (!audioCtxRef.current) {
          audioCtxRef.current = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (isPlaying) {
          if (melodyIntervalRef.current) clearInterval(melodyIntervalRef.current);
          setIsPlaying(false);
        } else {
          if (audioCtxRef.current.state === 'suspended') {
            audioCtxRef.current.resume();
          }
          setIsPlaying(true);
          const notes = [329.63, 392.0, 440.0, 493.88, 587.33, 659.25];
          melodyIntervalRef.current = setInterval(() => {
            try {
              const osc = audioCtxRef.current.createOscillator();
              const gain = audioCtxRef.current.createGain();
              osc.type = 'sine';
              osc.frequency.setValueAtTime(notes[Math.floor(Math.random() * notes.length)], audioCtxRef.current.currentTime);
              gain.gain.setValueAtTime(0.015, audioCtxRef.current.currentTime);
              gain.gain.exponentialRampToValueAtTime(0.0001, audioCtxRef.current.currentTime + 2.5);
              osc.connect(gain);
              gain.connect(audioCtxRef.current.destination);
              osc.start();
              osc.stop(audioCtxRef.current.currentTime + 2.5);
            } catch (err) {}
          }, 1200);
        }
      };

      // Full Fireworks & Floating Sparkles Canvas Physics
      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let width = (canvas.width = window.innerWidth);
        let height = (canvas.height = window.innerHeight);

        const handleResize = () => {
          width = canvas.width = window.innerWidth;
          height = canvas.height = window.innerHeight;
        };
        window.addEventListener('resize', handleResize);

        const particles = [];
        class Sparkle {
          constructor() { this.reset(); }
          reset() {
            this.x = Math.random() * width;
            this.y = Math.random() * height;
            this.size = Math.random() * 3 + 1;
            this.speedY = -(Math.random() * 0.4 + 0.1);
            this.speedX = (Math.random() - 0.5) * 0.3;
            this.opacity = Math.random() * 0.6 + 0.2;
            const colors = ['#D8B4FE', '#FDE047', '#7DD3FC', '#FDBA74'];
            this.color = colors[Math.floor(Math.random() * colors.length)];
          }
          update() {
            this.y += this.speedY;
            this.x += this.speedX;
            this.opacity -= 0.002;
            if (this.opacity <= 0 || this.y < 0) {
              this.reset();
              this.y = height + 10;
            }
          }
          draw() {
            ctx.save();
            ctx.globalAlpha = this.opacity;
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          }
        }

        for (let i = 0; i < 60; i++) particles.push(new Sparkle());

        let animationFrame;
        const animate = () => {
          ctx.clearRect(0, 0, width, height);
          particles.forEach(p => { p.update(); p.draw(); });
          animationFrame = requestAnimationFrame(animate);
        };
        animate();

        return () => {
          window.removeEventListener('resize', handleResize);
          cancelAnimationFrame(animationFrame);
        };
      }, []);

      // Interactive Touch & Cursor Fireworks Burst
      const handlePointerBurst = (e) => {
        if (e.target.closest('button')) return;
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const x = e.clientX || (e.touches && e.touches[0].clientX);
        const y = e.clientY || (e.touches && e.touches[0].clientY);
        if (!x || !y) return;

        const colors = ['#C084FC', '#F59E0B', '#38BDF8', '#FACC15', '#FB7185'];
        for (let i = 0; i < 22; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = Math.random() * 5 + 1.5;
          const vx = Math.cos(angle) * speed;
          const vy = Math.sin(angle) * speed;
          const color = colors[Math.floor(Math.random() * colors.length)];

          let alpha = 1;
          const drawParticle = () => {
            if (alpha <= 0) return;
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.arc(x + vx * (1 - alpha) * 18, y + vy * (1 - alpha) * 18, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
            alpha -= 0.025;
            requestAnimationFrame(drawParticle);
          };
          drawParticle();
        }
      };

      const diyaBlessings = [
        { title: 'Divine Abundance 🪔', text: 'May your life be overflowing with unending sweetness, peace, and eternal light.' },
        { title: 'Pure Joy ✨', text: 'May your heart always laugh as freely and brightly as it does today.' },
        { title: 'Shared Dreams 💍', text: 'May every step we take together bring us closer to a lifetime of happiness.' }
      ];

      const cards = [
        { title: 'Grace & Abundance', content: 'They pray for prosperity on Diwali. When I look at you, I realize my home is already blessed with the only light that truly matters.' },
        { title: '✨ A Verse For You ✨', content: '"Every diya that glows tonight, is a reflection of your radiant light. Every festival of lamps we share, is a promise whispered in a prayer."' },
        { title: 'OUR FOREVER BEGINS', content: 'Soon, our festive lights will merge into one home, one shared heartbeat, and a lifetime of celebrating every joy side by side.' }
      ];

      return (
        <div onPointerDown={handlePointerBurst} className="min-h-screen relative overflow-x-hidden select-none" style={{ background: 'linear-gradient(135deg, #FAF5FF 0%, #FEF9C3 50%, #E0F2FE 100%)' }}>
          <canvas ref={canvasRef} className="fixed inset-0 pointer-events-none z-0" />

          {/* Audio Toggle */}
          <button onClick={toggleAudio} className="fixed top-5 right-5 z-50 bg-white/80 border border-purple-200 text-purple-900 px-4 py-2 rounded-full text-xs font-semibold shadow-md backdrop-blur-md transition-transform hover:scale-105 flex items-center gap-2 cursor-pointer">
            <span>🎵</span> {isPlaying ? 'Pause Chimes' : 'Play Festive Melody'}
          </button>

          {/* Welcome Overlay */}
          {welcomeOpen && (
            <div className="fixed inset-0 z-40 bg-purple-950/40 backdrop-blur-md flex flex-col justify-center items-center text-center p-6">
              <div className="bg-white/95 border border-purple-200 p-8 rounded-3xl shadow-2xl max-w-sm w-full space-y-4">
                <p className="text-amber-600 uppercase tracking-widest text-xs font-bold">For my greatest blessing...</p>
                <h1 className="font-serif text-5xl text-purple-900 drop-shadow-sm">Shravika ❤️</h1>
                <p className="italic text-sky-700 text-sm leading-relaxed">
                  This Diwali, my world shines because you are in it.
                </p>
                <button onClick={(e) => { e.stopPropagation(); setWelcomeOpen(false); if (!isPlaying) toggleAudio(); }} className="w-full bg-gradient-to-r from-amber-400 via-yellow-300 to-sky-300 text-purple-950 font-bold py-3 rounded-full text-xs tracking-wider shadow-lg hover:scale-105 transition-transform cursor-pointer">
                  OPEN YOUR DIWALI SURPRISE ✨
                </button>
              </div>
            </div>
          )}

          {/* Main Content */}
          <main className="relative z-10 max-w-lg mx-auto px-4 py-16 text-center space-y-8">
            
            {/* Hero Card */}
            <div className="bg-white/80 border border-purple-100 backdrop-blur-md rounded-3xl p-8 shadow-xl relative overflow-hidden">
              <div className="absolute top-0 left-0 w-full h-1.5 bg-gradient-to-r from-amber-400 via-yellow-300 to-sky-400" />
              <span className="text-xs uppercase tracking-widest text-amber-600 font-bold">Deepavali 2026</span>
              <h2 className="text-2xl font-serif text-purple-900 mt-2 mb-4 leading-snug">
                "THIS DIWALI, MY GREATEST BLESSING IS YOU ❤️"
              </h2>
              <p className="text-sm text-slate-700 leading-relaxed">
                Every lamp glows brighter with the thought of you, and every prayer leads straight to our future together.
              </p>

              {/* Matka Reveal */}
              <div className="mt-8 flex flex-col items-center">
                {!potRevealed ? (
                  <button onClick={(e) => { e.stopPropagation(); setPotRevealed(true); }} className="group relative cursor-pointer focus:outline-none">
                    <div className="w-24 h-24 rounded-full bg-gradient-to-b from-amber-300 to-purple-200 p-1 shadow-lg transition-transform group-hover:scale-110 flex items-center justify-center">
                      <div className="w-full h-full rounded-full bg-white flex items-center justify-center text-4xl shadow-inner">
                        🏺
                      </div>
                    </div>
                    <p className="text-xs text-sky-700 uppercase tracking-wider mt-3 font-bold animate-pulse">
                      Tap the Sacred Matka to Reveal
                    </p>
                  </button>
                ) : (
                  <div className="bg-purple-50/90 border border-amber-300 rounded-2xl p-6 text-left space-y-3 shadow-sm animate-fade-in">
                    <h3 className="font-serif text-purple-900 text-lg font-bold">My Dearest Shravika,</h3>
                    <p className="text-xs text-slate-700 leading-relaxed">
                      As we celebrate this festival of lights, I find myself overwhelmed with gratitude. Of all the blessings Goddess Lakshmi could grant, bringing you into my life is the greatest gift I could ever ask for.
                    </p>
                  </div>
                )}
              </div>
            </div>

            {/* Swipeable Cards */}
            <div className="bg-white/80 border border-sky-100 backdrop-blur-md rounded-3xl p-8 shadow-xl relative">
              <div className="min-h-[140px] flex flex-col justify-center">
                <h3 className="font-serif text-xl text-amber-700 mb-3">{cards[currentCard].title}</h3>
                <p className="text-sm text-slate-700 italic leading-relaxed">{cards[currentCard].content}</p>
              </div>
              <div className="flex justify-center gap-2 mt-6">
                {cards.map((_, idx) => (
                  <button
                    key={idx}
                    onClick={(e) => { e.stopPropagation(); setCurrentCard(idx); }}
                    className={`h-2.5 rounded-full transition-all cursor-pointer ${
                      currentCard === idx ? 'bg-amber-500 w-6' : 'bg-purple-200 w-2.5'
                    }`}
                  />
                ))}
              </div>
            </div>

            {/* Interactive Diyas */}
            <div className="bg-white/80 border border-yellow-200 backdrop-blur-md rounded-3xl p-6 shadow-xl">
              <h3 className="font-serif text-base text-purple-900 mb-4 font-semibold">Click a Diya for a Blessing</h3>
              <div className="flex justify-around items-center">
                {diyaBlessings.map((blessing, idx) => (
                  <button
                    key={idx}
                    onClick={(e) => { e.stopPropagation(); setActiveModal(blessing); }}
                    className="text-4xl transition-transform hover:scale-125 focus:outline-none drop-shadow-md animate-bounce cursor-pointer"
                    style={{ animationDelay: `${idx * 0.2}s` }}
                  >
                    🪔
                  </button>
                ))}
              </div>
              <p className="text-[11px] text-sky-700 uppercase tracking-wider mt-5 font-bold animate-pulse">
                ✨ Tap any diya to reveal a secret blessing ✨
              </p>
            </div>

            {/* Grand Finale Card */}
            <div className="bg-gradient-to-b from-purple-100/90 to-white border border-amber-300 backdrop-blur-md rounded-3xl p-8 shadow-xl text-center space-y-4">
              <h2 className="font-serif text-xl text-purple-900 leading-snug">
                "THIS DIWALI,<br />I WISH FOR A LIFETIME<br />OF LIGHTS AND LOVE WITH YOU."
              </h2>
              <p className="text-xs text-slate-600">Happy Diwali, My Beautiful Shravika! ❤️</p>
              <div className="font-serif text-xl text-amber-600 pt-2 font-bold">Yours Forever,<br />Krishna ❤️</div>

              <button
                onClick={(e) => {
                  e.stopPropagation();
                  setLastThing(!lastThing);
                }}
                className="mt-4 border border-amber-400 text-amber-700 bg-amber-50 px-6 py-2 rounded-full text-xs tracking-widest uppercase hover:bg-amber-100 transition-all cursor-pointer font-bold shadow-sm"
              >
                ONE LAST THING... ❤️
              </button>

              {lastThing && (
                <div className="mt-4 bg-sky-50 border border-sky-200 rounded-xl p-4 text-xs italic text-sky-900 animate-fade-in">
                  "Out of all the blessings this Diwali could bring, I'm infinitely happiest that it brought you into my life."
                </div>
              )}
            </div>
          </main>

          {/* Diya Modal */}
          {activeModal && (
            <div
              onClick={() => setActiveModal(null)}
              className="fixed inset-0 z-50 bg-purple-950/40 backdrop-blur-sm flex justify-center items-center p-4"
            >
              <div
                onClick={(e) => e.stopPropagation()}
                className="bg-white border border-amber-300 rounded-2xl p-6 max-w-xs text-center shadow-2xl space-y-3"
              >
                <h4 className="font-serif text-lg text-purple-900 font-bold">{activeModal.title}</h4>
                <p className="text-xs text-slate-700 leading-relaxed">{activeModal.text}</p>
                <button
                  onClick={() => setActiveModal(null)}
                  className="bg-amber-500 text-purple-950 text-xs font-bold px-5 py-2 rounded-full mt-2 cursor-pointer shadow-md"
                >
                  Close
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
