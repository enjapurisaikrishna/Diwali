<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1F103C" />
  <title>Happy Diwali, Shravika ❤️</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    html, body, #root { min-height: 100%; margin: 0; }
    body { background: #1F103C; }
    .animate-fadeIn { animation: fadeIn 0.7s ease both; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
const { useState, useEffect, useRef } = React;

// Custom SVG Diya Component with Pulsing Flame & Glow
const VectorDiya = ({ className = "w-10 h-10", glowColor = "#FFB74D", onClick }) => (
  <div
    onClick={onClick}
    className="relative inline-block cursor-pointer transition-transform duration-300 hover:scale-125 select-none"
  >
    <svg className={className} viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="32" cy="18" r="16" fill="url(#flameAura)" opacity="0.75" />
      <path d="M32 4C32 4 23 15 23 22C23 26.9706 27.0294 31 32 31C36.9706 31 41 26.9706 41 22C41 15 32 4 32 4Z" fill="url(#flameGrad)" />
      <path d="M32 12C32 12 27 19 27 23C27 25.7614 29.2386 28 32 28C34.7614 28 37 25.7614 37 23C37 19 32 12 32 12Z" fill="#FFF9C4" />
      <path d="M10 34C10 34 6 48 22 56C32 61 42 61 52 56C68 48 64 34 64 34C64 34 46 40 37 40C28 40 10 34 10 34Z" fill="url(#potGrad)" />
      <path d="M8 34C8 34 22 38 37 38C52 38 66 34 66 34C66 34 54 43 37 43C20 43 8 34 8 34Z" fill="#FFA726" />
      <path d="M14 35C24 38 50 38 60 35" stroke="#FFE082" strokeWidth="1.5" strokeLinecap="round" opacity="0.8" />

      <defs>
        <radialGradient id="flameAura" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(32 18) scale(16)">
          <stop stopColor="#FFF9C4" />
          <stop offset="0.5" stopColor={glowColor} stopOpacity="0.8" />
          <stop offset="1" stopColor="#E6E6FA" stopOpacity="0" />
        </radialGradient>
        <linearGradient id="flameGrad" x1="32" y1="4" x2="32" y2="31" gradientUnits="userSpaceOnUse">
          <stop stopColor="#FFF9C4" />
          <stop offset="0.4" stopColor="#FFA726" />
          <stop offset="1" stopColor="#FF6D00" />
        </linearGradient>
        <linearGradient id="potGrad" x1="8" y1="34" x2="64" y2="60" gradientUnits="userSpaceOnUse">
          <stop stopColor="#FFB74D" />
          <stop offset="0.5" stopColor="#D8BFD8" />
          <stop offset="1" stopColor="#87CEEB" />
        </linearGradient>
      </defs>
    </svg>
  </div>
);

// Custom Vector Lotus Icon
const VectorLotus = ({ className = "w-8 h-8" }) => (
  <svg className={className} viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M32 12C32 12 24 24 24 36C24 44 32 48 32 48C32 48 40 44 40 36C40 24 32 12 32 12Z" fill="#F8BBD0" opacity="0.9" />
    <path d="M32 20C32 20 18 28 14 38C11 45 16 50 22 50C28 50 32 44 32 44C32 44 36 50 42 50C48 50 53 45 50 38C46 28 32 20 32 20Z" fill="#F48FB1" opacity="0.8" />
    <path d="M32 28C32 28 10 32 6 42C3 49 10 52 18 52C26 52 32 46 32 46C32 46 38 52 46 52C54 52 61 49 58 42C54 32 32 28 32 28Z" fill="#F06292" opacity="0.7" />
    <circle cx="32" cy="44" r="3" fill="#FFF9C4" />
  </svg>
);

// Earthen Pot (Matka) Reveal Component
const EarthenPot = ({ isOpen, onClick }) => (
  <div
    onClick={onClick}
    className="relative cursor-pointer group flex flex-col items-center justify-center my-8 select-none"
  >
    <div className={`relative transition-all duration-700 transform ${isOpen ? 'scale-110' : 'group-hover:scale-105'}`}>
      <div className="absolute -inset-6 rounded-full bg-gradient-to-r from-[#FFB74D] via-[#D8BFD8] to-[#87CEEB] opacity-60 blur-2xl group-hover:opacity-100 transition duration-1000 animate-pulse"></div>

      <svg className="w-48 h-48 drop-shadow-[0_12px_30px_rgba(255,183,77,0.4)]" viewBox="0 0 100 100" fill="none">
        <ellipse cx="50" cy="22" rx="28" ry="8" fill="#F57C00" />
        <ellipse cx="50" cy="20" rx="26" ry="7" fill="#FFE0B2" />
        <ellipse cx="50" cy="20" rx="20" ry="5" fill="#E6E6FA" />

        <path d="M28 22 C28 32 22 36 18 46 C12 60 18 84 50 88 C82 84 88 60 82 46 C78 36 72 32 72 22 Z" fill="url(#matkaColor)" />

        <path d="M20 46 C35 54 65 54 80 46" stroke="#FFF9C4" strokeWidth="2.5" strokeLinecap="round" />
        <path d="M15 60 C32 70 68 70 85 60" stroke="#87CEEB" strokeWidth="2" strokeDasharray="3 3" />
        <path d="M20 72 C35 80 65 80 80 72" stroke="#FFF9C4" strokeWidth="2" />

        <circle cx="50" cy="58" r="8" fill="#E6E6FA" opacity="0.6" />
        <path d="M50 50 C44 56 42 62 50 66 C58 62 56 56 50 50 Z" fill="#FFB74D" />

        <defs>
          <linearGradient id="matkaColor" x1="15" y1="20" x2="85" y2="88" gradientUnits="userSpaceOnUse">
            <stop stopColor="#FFA726" />
            <stop offset="0.35" stopColor="#E65100" />
            <stop offset="0.7" stopColor="#9C27B0" />
            <stop offset="1" stopColor="#3F51B5" />
          </linearGradient>
        </defs>
      </svg>

      <div className="absolute -bottom-2 flex space-x-6">
        <VectorDiya className="w-7 h-7" />
        <VectorDiya className="w-8 h-8" />
        <VectorDiya className="w-7 h-7" />
      </div>
    </div>

    <p className="mt-6 font-montserrat font-medium text-xs sm:text-sm tracking-widest uppercase bg-white/20 backdrop-blur-md text-[#311B92] px-5 py-2 rounded-full border border-white/40 shadow-lg group-hover:bg-white/30 transition-all">
      {isOpen ? "✨ Magical Love Scroll Unfolded ✨" : "✨ Tap Pot to Reveal Secret Poem ✨"}
    </p>
  </div>
);

// Pure Vector Romantic Cards Data
const cardData = [
  {
    title: "Light of My World",
    badge: "Grace & Prosperity",
    icon: "🪔",
    heading: "Goddess Lakshmi’s Blessing",
    body: "They say Goddess Lakshmi blesses a home with prosperity and happiness. Looking at you, I realize my heart has already found its absolute greatest blessing.",
    accentColor: "from-[#E6E6FA]/90 to-[#FFB74D]/80"
  },
  {
    title: "A Festival Verse",
    badge: "Poetic Love",
    icon: "🌸",
    heading: "Shining Brighter Than Lamps",
    body: "Every diya that glows tonight reflects the radiant warmth you bring into my life. May every prayer whispered under these festive skies bring us closer to our forever.",
    accentColor: "from-[#87CEEB]/90 to-[#D8BFD8]/90"
  },
  {
    title: "Our Lifetime Journey",
    badge: "Forever Begins",
    icon: "💍",
    heading: "Side by Side Always",
    body: "Soon, our individual paths turn into one shared home. From little conversations to lighting festive lamps together—my favourite new beginning is the one that leads to you.",
    accentColor: "from-[#FFF9C4]/90 to-[#FFA726]/80"
  }
];

function App() {
  const [welcomeOpen, setWelcomeOpen] = useState(false);
  const [potOpen, setPotOpen] = useState(false);
  const [cardIdx, setCardIdx] = useState(0);
  const [isPlayingMusic, setIsPlayingMusic] = useState(false);
  const [activeBlessing, setActiveBlessing] = useState(null);
  const [surpriseOpen, setSurpriseOpen] = useState(false);

  const canvasRef = useRef(null);
  const audioCtxRef = useRef(null);
  const musicIntervalRef = useRef(null);

  const microBlessings = [
    "✨ May Goddess Lakshmi fill your life with warmth, sweetness, and endless smiles!",
    "🪔 Wishing you a lifetime of joy, laughter, and endless festive love!",
    "💖 Every flickering lamp tonight carries a quiet prayer for your happiness.",
    "🌸 May your smile shine brighter than a thousand glowing diyas combined!",
    "💍 Here's to our very first Diwali of standing side-by-side!"
  ];

  // Canvas Touch & Drag Fireworks Trail System
  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');

    let width = (canvas.width = window.innerWidth);
    let height = (canvas.height = window.innerHeight);

    const handleResize = () => {
      width = (canvas.width = window.innerWidth);
      height = (canvas.height = window.innerHeight);
    };
    window.addEventListener('resize', handleResize);

    const particles = [];
    const trailParticles = [];

    // Background floating ambient sparkles
    class AmbientSparkle {
      constructor() { this.reset(); }
      reset() {
        this.x = Math.random() * width;
        this.y = Math.random() * height;
        this.size = Math.random() * 2.8 + 0.8;
        this.speedY = -(Math.random() * 0.4 + 0.15);
        this.speedX = (Math.random() - 0.5) * 0.3;
        this.opacity = Math.random() * 0.7 + 0.3;
        this.fade = Math.random() * 0.006 + 0.002;
        const colors = ['#FFB74D', '#E6E6FA', '#FFF9C4', '#87CEEB', '#D8BFD8'];
        this.color = colors[Math.floor(Math.random() * colors.length)];
      }
      update() {
        this.y += this.speedY;
        this.x += this.speedX;
        this.opacity -= this.fade;
        if (this.opacity <= 0 || this.y < 0) {
          this.reset();
          this.y = height + 10;
        }
      }
      draw() {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.opacity);
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    // Touch & Move Fireworks Sparkle Particle
    class TrailParticle {
      constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.color = color;
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 5 + 1.2;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.alpha = 1;
        this.decay = Math.random() * 0.02 + 0.012;
        this.size = Math.random() * 3.5 + 1.5;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += 0.04;
        this.alpha -= this.decay;
      }
      draw() {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.alpha);
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    for (let i = 0; i < 60; i++) {
      particles.push(new AmbientSparkle());
    }

    const spawnFireworks = (x, y) => {
      const colors = ['#FFB74D', '#E6E6FA', '#FFF9C4', '#87CEEB', '#FFA726', '#D8BFD8'];
      for (let i = 0; i < 22; i++) {
        const color = colors[Math.floor(Math.random() * colors.length)];
        trailParticles.push(new TrailParticle(x, y, color));
      }
    };

    const handlePointerMove = (e) => {
      if (Math.random() > 0.4) {
        spawnFireworks(e.clientX, e.clientY);
      }
    };

    const handlePointerDown = (e) => {
      spawnFireworks(e.clientX, e.clientY);
    };

    window.addEventListener('pointermove', handlePointerMove);
    window.addEventListener('pointerdown', handlePointerDown);

    let animId;
    const animate = () => {
      ctx.clearRect(0, 0, width, height);

      particles.forEach((p) => {
        p.update();
        p.draw();
      });

      for (let i = trailParticles.length - 1; i >= 0; i--) {
        const tp = trailParticles[i];
        tp.update();
        tp.draw();
        if (tp.alpha <= 0) {
          trailParticles.splice(i, 1);
        }
      }

      animId = requestAnimationFrame(animate);
    };

    animate();

    return () => {
      window.removeEventListener('resize', handleResize);
      window.removeEventListener('pointermove', handlePointerMove);
      window.removeEventListener('pointerdown', handlePointerDown);
      cancelAnimationFrame(animId);
    };
  }, []);

  // Web Audio Soft Chime Synth Generator
  const toggleMusic = () => {
    if (!audioCtxRef.current) {
      audioCtxRef.current = new (window.AudioContext || window.webkitAudioContext)();
    }

    if (isPlayingMusic) {
      if (musicIntervalRef.current) clearInterval(musicIntervalRef.current);
      setIsPlayingMusic(false);
    } else {
      if (audioCtxRef.current.state === 'suspended') {
        audioCtxRef.current.resume();
      }
      setIsPlayingMusic(true);

      const notes = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25];
      musicIntervalRef.current = setInterval(() => {
        try {
          const osc = audioCtxRef.current.createOscillator();
          const gain = audioCtxRef.current.createGain();

          const freq = notes[Math.floor(Math.random() * notes.length)];
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, audioCtxRef.current.currentTime);

          gain.gain.setValueAtTime(0.025, audioCtxRef.current.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, audioCtxRef.current.currentTime + 2.8);

          osc.connect(gain);
          gain.connect(audioCtxRef.current.destination);

          osc.start();
          osc.stop(audioCtxRef.current.currentTime + 2.8);
        } catch (err) {}
      }, 950);
    }
  };

  const triggerBlessing = (e) => {
    e?.stopPropagation();
    const b = microBlessings[Math.floor(Math.random() * microBlessings.length)];
    setActiveBlessing(b);
  };

  return (
    <div className="relative min-h-screen bg-gradient-to-br from-[#1F103C] via-[#2A164D] to-[#120826] text-[#4A148C] font-montserrat overflow-x-hidden select-none">
      <canvas ref={canvasRef} className="fixed inset-0 pointer-events-none z-0" />

      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Sacramento&family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Montserrat:wght@400;500;600;700&display=swap');
        .font-sacramento { font-family: 'Sacramento', cursive; }
        .font-playfair { font-family: 'Playfair Display', serif; }
        .font-montserrat { font-family: 'Montserrat', sans-serif; }
      `}</style>

      {/* Floating Soft Music Button */}
      <button
        onClick={toggleMusic}
        className="fixed top-5 right-5 z-50 flex items-center space-x-2 bg-white/20 backdrop-blur-md border border-white/40 text-white px-4 py-2 rounded-full shadow-lg hover:bg-white/30 transition-all text-xs tracking-widest uppercase font-medium"
      >
        <span className="text-sm">{isPlayingMusic ? '🎵' : '🔇'}</span>
        <span>{isPlayingMusic ? 'Pause Melody' : 'Play Ambient Melody'}</span>
      </button>

      {/* Opening Welcome Screen Overlay */}
      {!welcomeOpen && (
        <div className="fixed inset-0 z-50 flex flex-col items-center justify-center p-6 text-center bg-gradient-to-br from-[#2A164D] via-[#1F103C] to-[#0D051A]">
          <div className="flex space-x-4 mb-6">
            <VectorDiya onClick={triggerBlessing} />
            <VectorDiya onClick={triggerBlessing} />
            <VectorDiya onClick={triggerBlessing} />
          </div>

          <p className="text-[#FFB74D] text-xs uppercase tracking-[0.4em] font-semibold mb-2">
            For My Fianceé & Soulmate
          </p>

          <h1 className="font-sacramento text-6xl sm:text-7xl text-[#FFE082] drop-shadow-[0_0_20px_rgba(255,224,130,0.5)] mb-4">
            Shravika ❤️
          </h1>

          <p className="font-playfair italic text-[#E6E6FA] max-w-md text-base leading-relaxed mb-8">
            "This Diwali, my greatest blessing is you..."
          </p>

          <button
            onClick={() => {
              setWelcomeOpen(true);
              if (!isPlayingMusic) toggleMusic();
            }}
            className="group px-8 py-4 bg-gradient-to-r from-[#FFB74D] via-[#D8BFD8] to-[#87CEEB] text-[#311B92] font-bold rounded-full shadow-[0_0_30px_rgba(255,183,77,0.5)] hover:scale-105 transition-transform duration-300"
          >
            <span className="flex items-center space-x-2 text-xs tracking-widest uppercase font-montserrat">
              <span>Open Your Diwali Surprise</span>
              <span className="group-hover:translate-x-1 transition-transform">✨</span>
            </span>
          </button>
        </div>
      )}

      {/* Main Experience Section */}
      <main className={`relative z-10 max-w-2xl mx-auto px-4 py-10 transition-opacity duration-1000 ${welcomeOpen ? 'opacity-100' : 'opacity-0'}`}>

        {/* Main Header */}
        <header className="text-center mb-8">
          <div className="flex justify-center items-center space-x-3 mb-2">
            <VectorDiya onClick={triggerBlessing} className="w-8 h-8" />
            <VectorLotus className="w-8 h-8" />
            <VectorDiya onClick={triggerBlessing} className="w-8 h-8" />
          </div>

          <span className="text-xs uppercase tracking-[0.35em] text-[#FFB74D] font-semibold">
            Deepavali 2026
          </span>

          <h2 className="font-sacramento text-5xl sm:text-6xl text-[#FFE082] mt-1 drop-shadow-sm">
            Happy Diwali, My Love
          </h2>

          <div className="w-20 h-0.5 mx-auto bg-gradient-to-r from-transparent via-[#FFB74D] to-transparent my-3"></div>

          <p className="font-playfair italic text-[#E6E6FA] text-sm sm:text-base">
            "THIS DIWALI, MY GREATEST BLESSING IS YOU ❤️"
          </p>
        </header>

        {/* Earthen Pot Reveal Section */}
        <section className="mb-10">
          <EarthenPot isOpen={potOpen} onClick={() => setPotOpen(!potOpen)} />

          {potOpen && (
            <div className="animate-fadeIn mt-6 bg-white/10 backdrop-blur-md border border-white/30 rounded-3xl p-6 sm:p-8 shadow-[0_20px_50px_rgba(0,0,0,0.4)] relative overflow-hidden text-center">
              <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-[#FFB74D] via-[#D8BFD8] to-[#87CEEB]"></div>

              <div className="flex justify-center items-center space-x-2 mb-4">
                <VectorLotus className="w-6 h-6" />
                <h3 className="font-playfair text-2xl text-[#FFE082]">A Heartfelt Promise</h3>
                <VectorLotus className="w-6 h-6" />
              </div>

              <div className="font-playfair italic text-[#E6E6FA] space-y-4 leading-relaxed text-base">
                <p>
                  "They say Goddess Lakshmi blesses a home with prosperity, grace, and eternal joy. But when I look at you, I realize my world is already filled with all the radiance I could ever pray for."
                </p>

                <p className="text-[#FFE082] font-normal font-montserrat text-sm">
                  Every lamp lit tonight whispers a wish for your continuous smile, your biggest dreams, and the sweet future we are building step by step.
                </p>

                <p>
                  From two individual lives to one shared journey—I cannot wait for every Diwali yet to come, lit side-by-side with you.
                </p>
              </div>

              <div className="mt-6 pt-4 border-t border-white/20 font-sacramento text-3xl text-[#FFB74D]">
                Yours Forever, Krishna ❤️
              </div>
            </div>
          )}
        </section>

        {/* Clean Vector Love Cards Stack */}
        <section className="mb-10">
          <div className="flex items-center justify-between mb-3 px-2">
            <h3 className="font-playfair text-lg text-[#FFE082] flex items-center space-x-2">
              <span>🌸</span>
              <span>Our Festive Blessings</span>
            </h3>

            <span className="text-xs text-[#E6E6FA] font-montserrat">
              {cardIdx + 1} of {cardData.length}
            </span>
          </div>

          <div className="relative rounded-3xl overflow-hidden border border-white/30 shadow-2xl bg-white/10 backdrop-blur-md">
            <div className={`p-6 sm:p-8 bg-gradient-to-br ${cardData[cardIdx].accentColor} text-[#2A164D]`}>
              <div className="flex items-center justify-between mb-4">
                <span className="text-xs font-montserrat uppercase tracking-wider px-3 py-1 bg-white/30 border border-white/40 rounded-full font-semibold">
                  {cardData[cardIdx].badge}
                </span>

                <span className="text-2xl">{cardData[cardIdx].icon}</span>
              </div>

              <div className="flex justify-center my-4 py-4 bg-white/20 rounded-2xl border border-white/30">
                <div className="flex items-center space-x-4">
                  <VectorDiya className="w-8 h-8" />
                  <VectorLotus className="w-10 h-10" />
                  <VectorDiya className="w-8 h-8" />
                </div>
              </div>

              <h4 className="font-playfair text-2xl font-bold mb-1">
                {cardData[cardIdx].heading}
              </h4>

              <p className="text-xs uppercase tracking-widest font-semibold opacity-80 mb-4">
                {cardData[cardIdx].title}
              </p>

              <p className="font-playfair italic text-base leading-relaxed">
                "{cardData[cardIdx].body}"
              </p>
            </div>

            {/* Card Navigation */}
            <div className="flex justify-between items-center px-6 py-3.5 bg-[#1F103C]/80 border-t border-white/10 text-xs">
              <button
                onClick={() => setCardIdx((prev) => (prev === 0 ? cardData.length - 1 : prev - 1))}
                className="font-montserrat font-semibold uppercase tracking-wider text-[#FFE082] hover:text-white transition"
              >
                ← Previous
              </button>

              <div className="flex space-x-1.5">
                {cardData.map((_, i) => (
                  <div
                    key={i}
                    onClick={() => setCardIdx(i)}
                    className={`h-2 rounded-full transition-all cursor-pointer ${i === cardIdx ? 'w-6 bg-[#FFB74D]' : 'w-2 bg-white/30'}`}
                  />
                ))}
              </div>

              <button
                onClick={() => setCardIdx((prev) => (prev === cardData.length - 1 ? 0 : prev + 1))}
                className="font-montserrat font-semibold uppercase tracking-wider text-[#FFE082] hover:text-white transition"
              >
                Next →
              </button>
            </div>
          </div>
        </section>

        {/* Framing Diyas Row */}
        <div className="flex justify-around items-center py-5 border-y border-white/10 my-8">
          <VectorDiya onClick={triggerBlessing} className="w-8 h-8" />
          <VectorDiya onClick={triggerBlessing} className="w-9 h-9" />
          <VectorDiya onClick={triggerBlessing} className="w-8 h-8" />
          <VectorDiya onClick={triggerBlessing} className="w-9 h-9" />
        </div>

        {/* Footer Finale */}
        <footer className="text-center py-6">
          <p className="font-sacramento text-4xl text-[#FFE082] mb-1">
            A Lifetime of Lights & Love
          </p>

          <p className="font-playfair italic text-xs sm:text-sm text-[#E6E6FA]/90 max-w-sm mx-auto mb-6 leading-relaxed">
            "May your life always shine as beautifully as you make mine."
          </p>

          {/* Hidden Surprise Note Button */}
          <button
            onClick={() => setSurpriseOpen(!surpriseOpen)}
            className="px-6 py-2.5 rounded-full border border-dashed border-[#FFB74D] text-[#FFB74D] text-xs uppercase tracking-widest font-montserrat font-medium hover:bg-[#FFB74D]/20 transition"
          >
            {surpriseOpen ? "Close Secret Note ❤️" : "ONE LAST THING... ❤️"}
          </button>

          {surpriseOpen && (
            <div className="animate-fadeIn mt-4 p-5 bg-white/10 backdrop-blur-md border border-[#FFB74D]/50 rounded-2xl max-w-md mx-auto text-sm italic font-playfair text-[#FFE082] shadow-xl">
              "Out of all the blessings this Diwali could bring, I'm infinitely happiest that it brought you into my life."
            </div>
          )}
        </footer>
      </main>

      {/* Micro-Blessing Modal Pop-up */}
      {activeBlessing && (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm animate-fadeIn">
          <div className="bg-gradient-to-br from-[#2A164D] via-[#1F103C] to-[#120826] border-2 border-[#FFB74D] rounded-3xl p-6 max-w-sm text-center shadow-[0_0_50px_rgba(255,183,77,0.4)]">
            <div className="flex justify-center space-x-2 mb-3">
              <VectorDiya className="w-8 h-8" />
            </div>

            <h4 className="font-playfair text-[#FFE082] text-lg mb-2">
              Festive Blessing
            </h4>

            <p className="font-playfair italic text-[#E6E6FA] text-sm mb-6 leading-relaxed">
              {activeBlessing}
            </p>

            <button
              onClick={() => setActiveBlessing(null)}
              className="px-6 py-2 bg-gradient-to-r from-[#FFB74D] to-[#FFA726] text-[#311B92] font-bold rounded-full text-xs uppercase tracking-wider font-montserrat hover:scale-105 transition"
            >
              Thank You ❤️
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
